# Every push to main and every pull request is type-checked, tested, built, and driven in a
# browser (e2e/). A push to main that passes is then published as the web editor, on Cloudflare
# (see wrangler.jsonc).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Also writes the site around the editor (about/, llms.txt, schema/): packages/cli/src/build-site.ts.
      - run: pnpm build:web
      # The package a version tag publishes on npm (release.yml) must bundle and start.
      - run: pnpm package:npm && node packages/cli/npm/dist/cli.js --version
      # The licences shown under About and shipped with the installers are those of what the build holds.
      - run: pnpm notices --check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces
          path: test-results
      - uses: actions/upload-artifact@v4
        with:
          name: web
          if-no-files-found: error
          path: apps/web/dist

  deploy:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # One deployment at a time, and never one abandoned halfway.
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: apps/web/dist
      - run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
